name: LLM Release Digest

on:
  schedule:
    # 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Hours to look back for 'new' items (default 24). Widen this for a test send."
        required: false
        default: "24"
      ignore_seen:
        description: "Ignore the already-seen-before check (test sends only -- never affects saved state)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r llm-release-monitor/requirements.txt

      - name: Run digest
        working-directory: llm-release-monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '24' }}
          IGNORE_SEEN: ${{ inputs.ignore_seen || 'false' }}
        run: python -m src.main

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llm-release-monitor/state/seen_items.json
          git diff --cached --quiet || git commit -m "Update seen items state [skip ci]"
          git push
